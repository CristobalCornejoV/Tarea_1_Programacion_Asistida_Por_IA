<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tres en Raya</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>Tres en Raya</h1>

  <div id="marcador-sesion" aria-live="polite"></div>

  <!-- Los 4 estados de EstadoUI.pantalla (data-model.md); cada uno se
       muestra/oculta vía el atributo `hidden` según la pantalla vigente
       (wiring en las tareas de cada historia de usuario). -->
  <section id="pantalla-configuracion" data-pantalla="configuracion"></section>
  <section id="pantalla-en_juego" data-pantalla="en_juego" hidden></section>
  <section id="pantalla-esperando_agente" data-pantalla="esperando_agente" hidden></section>
  <section id="pantalla-terminada" data-pantalla="terminada" hidden></section>

  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/board.js"></script>
  <script type="module" src="js/config-screen.js"></script>
  <script type="module" src="js/game-screen.js"></script>
  <script type="module" src="js/scoreboard.js"></script>
  <script type="module" src="js/keyboard.js"></script>
</body>
</html>
